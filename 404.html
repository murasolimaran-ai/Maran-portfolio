<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Murasolimaran</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #050b14;
      --card: #0b1422;
      --orange: #ff7e00;
      --white: #ffffff;
      --muted: #9aa7b8;
      --border: rgba(255, 126, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(circle at 50% 35%,
          rgba(255, 126, 0, 0.10),
          transparent 35%),
        var(--bg);

      color: var(--white);
      font-family: "Barlow", sans-serif;
    }

    .error-card {
      width: min(100%, 620px);
      padding: 55px 35px;
      text-align: center;

      background: rgba(11, 20, 34, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .error-code {
      font-family: "Exo 2", sans-serif;
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 0.9;
      color: var(--orange);
      letter-spacing: -0.05em;
    }

    .error-icon {
      margin: 20px 0;
      font-size: 1.8rem;
      color: var(--orange);
    }

    h1 {
      margin-bottom: 12px;

      font-family: "Exo 2", sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
    }

    p {
      max-width: 450px;
      margin: 0 auto 28px;

      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .error-path {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 28px;
      padding: 8px 14px;

      color: var(--orange);
      background: rgba(255, 126, 0, 0.08);
      border: 1px solid rgba(255, 126, 0, 0.18);
      border-radius: 8px;

      font-family: monospace;
      font-size: 0.85rem;

      overflow-wrap: anywhere;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 12px 22px;

      color: #000;
      background: var(--orange);

      border: 1px solid var(--orange);
      border-radius: 50px;

      font-family: "Exo 2", sans-serif;
      font-weight: 800;
      text-decoration: none;

      transition: 0.25s ease;
    }

    .home-btn:hover {
      color: var(--orange);
      background: transparent;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 42px 22px;
      }

      .error-code {
        font-size: 6rem;
      }

      .home-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="error-card">

    <div class="error-code">404</div>

    <div class="error-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h1>Page Not Found</h1>

    <p>
      The page you're looking for doesn't exist or the URL may be incorrect.
    </p>

    <div class="error-path" id="errorPath"></div>

    <br>

    <a href="/" class="home-btn">
      <i class="fa-solid fa-house"></i>
      Back to Home
    </a>

  </main>

  <script>
    document.getElementById("errorPath").textContent =
      window.location.pathname;
  </script>

</body>

</html>
